/* ── THEME VARIABLES ─────────────────────────────── */
:root{
  --bg:#010C1F;--card:#fff1;--border:rgba(0,61,165,.25);
  --text:#fff;--muted:#5A7EA0;--sep:rgba(0,61,165,.2);
  --hover:rgba(0,61,165,.12);--shadow:0 4px 20px rgba(0,61,165,.3);
  --pill-bg:rgba(0,61,165,.15);--pill-sel:#fff;--pill-sel-bg:#003DA5;
  --input-bg:rgba(0,61,165,.1);--divider:rgba(255,255,255,.08)
}
[data-theme=light]{
  --bg:#EDE8DB;--card:#fff;--border:#ccc7be;
  --text:#1a1a1a;--muted:#7a7570;--sep:#d4cfc5;
  --hover:rgba(0,0,0,.05);--shadow:0 2px 12px rgba(0,0,0,.1);
  --pill-bg:#e4dfd5;--pill-sel:#fff;--pill-sel-bg:#1a1a1a;
  --input-bg:#f5f0e8;--divider:#d4cfc5
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font-family:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer;border:none;outline:none}
a{color:inherit;text-decoration:none}

/* ── LAYOUT ──────────────────────────────────────── */
.page{max-width:520px;margin:0 auto;padding:0 0 60px}
.page-wide{max-width:860px;margin:0 auto}

/* GAME 3-COL desktop */
.game-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;max-width:1100px;margin:0 auto;padding:10px 10px 40px;align-items:start}
@media(max-width:700px){
  .game-cols{display:flex;flex-direction:column;padding:0 0 80px;align-items:stretch}
  .col-right{display:none}
  .col-left{order:1;width:100%}
  .col-pitch{order:2;border-top:1px solid var(--sep);width:100%}
}

/* ── COMPONENTS ──────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.pill{padding:7px 12px;border-radius:6px;border:1px solid var(--border);background:var(--pill-bg);color:var(--muted);font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;transition:all .15s;min-height:38px}
.pill.sel{background:var(--pill-sel-bg);color:var(--pill-sel);border-color:var(--pill-sel-bg)}
.btn-red{background:#CE2B37;color:#fff;border-radius:8px;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;padding:14px 0;width:100%;box-shadow:0 5px 20px rgba(206,43,55,.45);transition:transform .1s}
.btn-red:active{transform:scale(.97)}
@keyframes pulseRed{0%,100%{box-shadow:0 5px 20px rgba(206,43,55,.45)}50%{box-shadow:0 0 0 6px rgba(206,43,55,.18),0 5px 28px rgba(206,43,55,.7)}}
.btn-red-pulse{animation:pulseRed 1.6s ease-in-out infinite;font-size:22px}
.btn-blue{background:linear-gradient(135deg,#003DA5,#1565C0);color:#fff;border-radius:8px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;padding:12px 0;width:100%;box-shadow:0 5px 18px rgba(0,61,165,.45)}
.label{font-family:'Bebas Neue',sans-serif;font-size:10px;letter-spacing:3px;color:var(--muted)}
.sep{height:1px;background:var(--sep);margin:0}

/* PLAYER LIST */
.pitem{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--divider);cursor:pointer;transition:background .1s}
.pitem:hover,.pitem.active{background:var(--hover)}
.pitem.disabled{opacity:.22;cursor:default;pointer-events:none}

/* MATCH CARD */
.match-row{border-bottom:1px solid var(--sep);padding:10px 14px}
.match-row:last-child{border:none}

/* SLOT */
.slot-wrap{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:52px}
.slot-circle{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .15s}
[data-theme=light] .slot-circle{border-color:rgba(0,0,0,.3)}
.slot-circle.hl{border-color:#E8C468;box-shadow:0 0 0 4px rgba(201,162,39,.4);animation:hlp .85s infinite alternate;cursor:pointer}
@keyframes hlp{from{box-shadow:0 0 0 3px rgba(201,162,39,.35)}to{box-shadow:0 0 0 6px rgba(201,162,39,.65)}}
.slot-name{font-family:'Inter',sans-serif;font-size:8px;font-weight:600;background:rgba(1,12,31,.88);color:#fff;padding:1px 3px;border-radius:3px;text-align:center;line-height:1.3;max-width:50px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[data-theme=light] .slot-name{background:rgba(237,232,219,.92);color:#1a1a1a}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:300;padding:16px}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;max-width:380px;max-height:88vh;overflow-y:auto}

/* SHARE CARD */
.share-card{background:var(--bg);border:2px solid #C9A227;border-radius:12px;padding:18px 14px;max-width:340px;margin:0 auto}
[data-theme=light] .share-card{background:#1a1a1a}

/* NEWS */
.news-item{border-bottom:1px solid var(--sep);padding:10px 0;display:block}
.news-item:last-child{border:none}

/* HERO LAYOUT */
.hero-layout{display:flex;flex-direction:column;gap:0}

  .hero-layout{flex-direction:row;align-items:flex-start;gap:32px;max-width:920px;margin:0 auto;padding:8px 16px 24px}

@media(max-width:859px){
  .hero-text{padding:8px 16px 0}
  .hero-pitch{padding:0 16px 24px;max-width:100%}

/* ANIMS */
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fi{animation:fadein .2s ease}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

const rng=()=>Math.random();const pick=a=>a[Math.floor(rng()*a.length)];const clamp=(v,l,h)=>Math.max(l,Math.min(h,v));
function poisson(lam){const e=Math.exp(-lam);let k=0,p=1;do{k++;p*=rng()}while(p>e);return k-1}
function gCount(att,def){return Math.min(7,Math.max(0,poisson(clamp(1.4+(att-def)*0.08,0.15,5))))}
function gMins(n){const s=new Set();while(s.size<n)s.add(1+Math.floor(89*Math.pow(rng(),0.85)));return[...s].sort((a,b)=>a-b)}
function scorers(sq,n){if(!sq||!sq.length||n===0)return[];const wt={"CA":8,"MEI":4,"PD":4,"PE":4,"MC":2,"VOL":1};const pool=sq.flatMap(p=>{const w=(p.pos||[]).reduce((m,r)=>Math.max(m,wt[r]||0.5),1);return Array(Math.max(1,Math.round(w))).fill(p)});return Array(n).fill(0).map(()=>pick(pool)||sq[0])}
function penKicks(itaW,iSq,oSq){const nm=(sq,n)=>[...sq].sort((a,b)=>(b.f||80)-(a.f||80)).slice(0,n).map(p=>p.n||p.name||"?");const it=nm(iSq,5),op=oSq&&oSq.length?nm([...oSq],5):["Avv1","Avv2","Avv3","Avv4","Avv5"];const ik=Array(5).fill(0).map(()=>rng()<(itaW?0.78:0.56));const ok=Array(5).fill(0).map(()=>rng()<(itaW?0.56:0.78));const iT=ik.filter(Boolean).length,oT=ok.filter(Boolean).length;if(itaW&&iT<=oT){const i=ik.indexOf(false);if(i>=0)ik[i]=true;else{const j=ok.lastIndexOf(true);if(j>=0)ok[j]=false}}else if(!itaW&&oT<=iT){const i=ok.indexOf(false);if(i>=0)ok[i]=true;else{const j=ik.lastIndexOf(true);if(j>=0)ik[j]=false}}const k=[];for(let i=0;i<5;i++){k.push({s:"ita",n:it[i],sc:ik[i]});k.push({s:"opp",n:op[i],sc:ok[i]})}return k}
function simM(iStr,oStr,isKO,iSq,oSq,style,playerStats){
  const st=STILI[style]||{a:0,d:0};const gf=gCount(iStr+st.a*0.5,oStr),ga=gCount(oStr,iStr+st.d*0.5);
  // Quando oSq è vuoto (es. qualificazioni) NON ricadere su iSq italiano
  const GENERIC_OPP=[{n:"Avversario"},{n:"Avversario"},{n:"Avversario"},{n:"Avversario"},{n:"Avversario"},{n:"Avversario"},{n:"Avversario"},{n:"Avversario"},{n:"Avversario"},{n:"Avversario"},{n:"Avversario"}];
  const effectiveOSq=oSq&&oSq.length?oSq:GENERIC_OPP;
  const iSc=scorers(iSq,gf),oSc=scorers(effectiveOSq,ga);
  const iM=gMins(gf),oM=gMins(ga).map(m=>iM.includes(m)?m+1:m);
  const goals=[...iSc.map((p,i)=>({min:iM[i]||45,name:p.n||p,id:p.id,ita:true})),...oSc.map((p,i)=>({min:oM[i]||50,name:p.n||p.name||"?",ita:false}))].sort((a,b)=>a.min-b.min);
  // Track stats
  if(playerStats){for(const g of goals){if(g.ita&&g.id){playerStats[g.id]=(playerStats[g.id]||0)+1}}}
  let winner=gf>ga?"ITA":ga>gf?"OPP":"DRAW",pens=null,kicks=null;
  if(isKO&&gf===ga){const w=rng()<clamp(0.5+(iStr-oStr)*0.012,0.1,0.9);pens=w?"5-4":"4-5";winner=w?"ITA":"OPP";kicks=penKicks(w,iSq,oSq)}
  return{gf,ga,goals,winner,pens,kicks}
}
function runQualification(xi,iStr,style){
  const opps=EURO_OPP.filter((o,i,a)=>a.findIndex(x=>x.s===o.s&&x.y===o.y)===i);
  const grp=[pick(opps)];const used=new Set([grp[0].s+grp[0].y]);
  let o2=pick(opps.filter(o=>!used.has(o.s+o.y)));grp.push(o2||grp[0]);
  const ps={};let myP=0,wins=0,draws=0,losses=0,gf=0,ga=0;
  const events=[];
  for(const opp of grp){
    const m=simM(iStr,opp.o,false,xi,[],style,ps);
    gf+=m.gf;ga+=m.ga;
    if(m.winner==="ITA"){wins++;myP+=3}else if(m.winner==="DRAW"){draws++;myP+=1}else{losses++}
    events.push({t:"match",round:"Qualificazioni UEFA",opp,m});
  }
  const qualified=myP>=2;
  events.push({t:"qualEnd",qualified,pts:myP,wins,draws,losses,gf,ga});
  return{events,qualified};
}
function runT(xi,iStr,style){
  const used=new Set();const drawOpp=()=>{const a=OPP.filter(o=>!used.has(o.s+o.y));const o=pick(a.length?a:OPP);used.add(o.s+o.y);return o};
  const events=[];let sv=false,wins=0,draws=0,losses=0,tgf=0,tga=0;const ps={};
  const grp=[drawOpp(),drawOpp(),drawOpp()];
  const gt=[{nm:"🇮🇹 Italia",pts:0,gf:0,ga:0,me:true},...grp.map(o=>({nm:o.f+" "+o.n+" '"+String(o.y).slice(2),pts:0,gf:0,ga:0,me:false}))];
  let myP=0;
  for(let i=0;i<3;i++){const opp=grp[i];const m=simM(iStr,opp.o,false,xi,opp.sq,style,ps);if(m.gf===7&&m.ga===0)sv=true;tgf+=m.gf;tga+=m.ga;if(m.winner==="ITA"){wins++;myP+=3;gt[0].pts+=3}else if(m.winner==="DRAW"){draws++;myP+=1;gt[0].pts+=1;gt[i+1].pts+=1}else{losses++;gt[i+1].pts+=3}gt[0].gf+=m.gf;gt[0].ga+=m.ga;gt[i+1].gf+=m.ga;gt[i+1].ga+=m.gf;events.push({t:"match",round:"Gironi",opp,m})}
  const qualified=myP>=4;const table=[...gt].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga));
  events.push({t:"standings",qualified,pts:myP,table});
  if(!qualified){events.push({t:"end",champion:false,where:"gironi",sv,wins,draws,losses,gf:tgf,ga:tga,playerStats:ps});return{events,iStr}}
  for(const round of["Ottavi","Quarti","Semifinale","Finale"]){
    const opp=drawOpp();const m=simM(iStr,opp.o,true,xi,opp.sq,style,ps);if(m.gf===7&&m.ga===0)sv=true;tgf+=m.gf;tga+=m.ga;
    // Infortuni: 15% chance KO match
    let injury=null;if(rng()<0.15){const victims=xi.filter(p=>p.pos[0]!=="GOL");if(victims.length){injury=pick(victims)}}
    if(m.winner==="ITA")wins++;else if(m.winner==="DRAW")draws++;else losses++;
    events.push({t:"match",round,opp,m,injury});
    if(m.winner==="OPP"){events.push({t:"end",champion:false,where:round.toLowerCase(),sv,wins,draws,losses,gf:tgf,ga:tga,playerStats:ps});return{events,iStr}}
  }
  events.push({t:"end",champion:true,sv,wins,draws,losses,gf:tgf,ga:tga,playerStats:ps});return{events,iStr}
}

function News(){
  const [news,setNews]=useState([]);const [loading,setLoading]=useState(true);
  useEffect(()=>{
    fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent("https://www.gazzetta.it/dynamic-feed/rss/section/Calcio/nazionali.xml"))
      .then(r=>r.json()).then(d=>{
        if(!d.items||!d.items.length)return;
        setNews(d.items.slice(0,5).map(it=>({
          title:it.title||"",
          link:it.link||"#",
          date:(it.pubDate||"").slice(0,16)
        })));
      }).catch(()=>{}).finally(()=>setLoading(false));
  },[]);
  if(loading)return<div style={{color:"var(--muted)",fontSize:12,padding:"8px 0"}}>Caricamento notizie Gazzetta...</div>;
  if(!news.length)return<div style={{color:"var(--muted)",fontSize:12,padding:"8px 0"}}>Notizie non disponibili al momento.</div>;
  return(<div>{news.map((n,i)=><a key={i} href={n.link} target="_blank" rel="noopener" className="news-item"><div style={{fontSize:13,fontWeight:600,color:"var(--text)",lineHeight:1.4,marginBottom:2}}>{n.title}</div><div style={{fontSize:10,color:"var(--muted)"}}>{n.date}</div></a>)}</div>);
}

/* ── SHARE CANVAS GENERATOR ───────────────────────── */
async function buildShareCanvas(run,assign,slots){
  const endEv=run.events.find(e=>e.t==="end");
  const matchEvs=run.events.filter(e=>e.t==="match");
  const ps=endEv?.playerStats||{};
  const pl=Object.values(assign).filter(Boolean);
  const ov=pl.length?Math.round(pl.reduce((s,p)=>s+p.f,0)/pl.length):0;
  const players=slots.map((s,i)=>assign[i]?{...assign[i],slotP:s.p}:null).filter(Boolean);

  const W=640;
  const HERO_H=210;
  const G='#009246',R='#CE2B37',GOLDL='#E8C468',GOLD='#C9A227',AZ='#003DA5';
  const BG='#010C1F',MUTED='#5A7EA0',SEP='rgba(0,61,165,0.3)';

  /* load hero image */
  let heroImg=null;
  try{
    heroImg=await new Promise((res)=>{
      const img=new Image();img.crossOrigin='anonymous';
      img.onload=()=>res(img);img.onerror=()=>res(null);
      img.src='/public/GettyImages-1224319980.webp';
    });
  }catch(e){}

  /* dynamic height */
  const H=HERO_H+60+28+32+matchEvs.length*44+28+36+Math.ceil(players.length/2)*34+110;
  const DPR=2;
  const cv=document.createElement('canvas');
  cv.width=W*DPR; cv.height=H*DPR;
  const c=cv.getContext('2d');
  c.scale(DPR,DPR);

  /* helpers */
  const rr=(x,y,w,h,r)=>{c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);};
  const hline=(y,a=SEP)=>{c.strokeStyle=a;c.lineWidth=1;c.beginPath();c.moveTo(24,y);c.lineTo(W-24,y);c.stroke();};

  /* bg */
  c.fillStyle=BG; c.fillRect(0,0,W,H);

  /* subtle pitch texture below hero */
  for(let i=HERO_H;i<H;i+=28){c.fillStyle=i%56===0?'rgba(0,40,10,0.18)':'rgba(0,30,8,0.10)';c.fillRect(0,i,W,14);}

  /* HERO: Getty image or gradient fallback */
  if(heroImg){
    const iw=heroImg.naturalWidth||heroImg.width,ih=heroImg.naturalHeight||heroImg.height;
    const scale=Math.max(W/iw,HERO_H/ih);
    const dw=iw*scale,dh=ih*scale;
    c.save();c.beginPath();c.rect(0,0,W,HERO_H);c.clip();
    c.drawImage(heroImg,(W-dw)/2,(HERO_H-dh)/2,dw,dh);
    c.restore();
  }else{
    const grd=c.createLinearGradient(0,0,W,HERO_H);
    grd.addColorStop(0,'#001A4D');grd.addColorStop(1,'#010C1F');
    c.fillStyle=grd;c.fillRect(0,0,W,HERO_H);
  }
  /* dark overlay over hero */
  const ovg=c.createLinearGradient(0,0,0,HERO_H);
  ovg.addColorStop(0,'rgba(1,12,31,0.30)');
  ovg.addColorStop(0.55,'rgba(1,12,31,0.18)');
  ovg.addColorStop(1,'rgba(1,12,31,0.90)');
  c.fillStyle=ovg;c.fillRect(0,0,W,HERO_H);

  /* tricolor strip */
  c.fillStyle=G;c.fillRect(0,0,W/3,8);
  c.fillStyle='#fff';c.fillRect(W/3,0,W/3,8);
  c.fillStyle=R;c.fillRect(2*W/3,0,W/3,8);

  /* stars */
  c.fillStyle=GOLD;c.font='16px serif';c.textAlign='center';
  c.fillText('★  ★  ★  ★',W/2,34);

  /* ITALIA MUNDIAL on hero */
  c.shadowColor='rgba(0,0,0,0.9)';c.shadowBlur=16;
  c.fillStyle='#fff';c.font='700 58px "Bebas Neue",Impact,sans-serif';c.textAlign='center';
  c.fillText('ITALIA MUNDIAL',W/2,HERO_H-55);
  c.shadowBlur=0;

  let cy=HERO_H;

  /* result badge */
  const champ=endEv?.champion;
  const resultTxt=champ?'🏆 CAMPIONI DEL MONDO':'❌ ELIMINATI — '+(endEv?.where||'').toUpperCase();
  c.fillStyle=champ?'rgba(201,162,39,0.15)':'rgba(206,43,55,0.15)';
  rr(20,cy,W-40,50,10);c.fill();
  c.strokeStyle=champ?GOLD:R;c.lineWidth=1.5;
  rr(20,cy,W-40,50,10);c.stroke();
  c.fillStyle=champ?GOLDL:R;c.font='700 26px "Bebas Neue",Impact,sans-serif';c.textAlign='center';
  c.fillText(resultTxt,W/2,cy+33);cy+=62;

  /* stats row */
  const stats=[['V',endEv?.wins||0],['P',endEv?.draws||0],['S',endEv?.losses||0],['GF',endEv?.gf||0],['GS',endEv?.ga||0],['OVR',ov]];
  const sw=W/stats.length;
  stats.forEach(([l,v],i)=>{
    const x=sw*i+sw/2;
    c.fillStyle=l==='OVR'?G:GOLDL;c.font='700 22px "Montserrat",Arial,sans-serif';c.textAlign='center';
    c.fillText(v,x,cy+20);
    c.fillStyle=MUTED;c.font='9px "Bebas Neue",Impact,sans-serif';
    c.fillText(l,x,cy+34);
  });
  cy+=50;

  hline(cy+4);cy+=24;

  /* IL CAMMINO */
  c.fillStyle=MUTED;c.font='10px "Bebas Neue",Impact,sans-serif';c.textAlign='left';
  c.fillText('IL CAMMINO',24,cy+12);cy+=28;

  matchEvs.forEach(ev=>{
    const wc=ev.m.winner==='ITA'?G:ev.m.winner==='DRAW'?MUTED:R;
    const ic=ev.m.winner==='ITA'?'✓':ev.m.winner==='DRAW'?'–':'✗';
    c.fillStyle='rgba(255,255,255,0.04)';rr(20,cy-2,W-40,36,6);c.fill();
    /* round */
    c.fillStyle=MUTED;c.font='9px "Bebas Neue",Impact,sans-serif';c.textAlign='left';
    c.fillText(ev.round.toUpperCase(),28,cy+12);
    /* opp */
    c.fillStyle='#fff';c.font='600 13px "Inter",Arial,sans-serif';
    c.fillText(ev.opp.f+' '+ev.opp.n+" '"+String(ev.opp.y).slice(2),28,cy+28);
    /* score */
    c.fillStyle=wc;c.font='700 18px "Montserrat",Arial,sans-serif';c.textAlign='right';
    c.fillText(ev.m.gf+'–'+ev.m.ga,W-60,cy+28);
    c.font='700 14px "Bebas Neue",Impact,sans-serif';
    c.fillText(ic+(ev.m.pens?' dcr':''),W-24,cy+28);
    cy+=44;
  });

  hline(cy+4);cy+=24;

  /* LA SQUADRA */
  c.fillStyle=MUTED;c.font='10px "Bebas Neue",Impact,sans-serif';c.textAlign='left';
  c.fillText('LA SQUADRA · OVR '+ov,24,cy+12);cy+=30;

  const cw=(W-56)/2;
  players.forEach((p,i)=>{
    const col=i%2,row=Math.floor(i/2);
    const px=24+col*(cw+8),py=cy+row*34;
    const goals=ps[p.id]||0;
    c.fillStyle=p.l?'rgba(201,162,39,0.10)':'rgba(255,255,255,0.04)';
    rr(px,py,cw,28,5);c.fill();
    /* pos badge */
    c.fillStyle=RC[p.slotP]||'#555';
    rr(px+4,py+5,24,18,3);c.fill();
    c.fillStyle='#fff';c.font='700 8px "Inter",Arial,sans-serif';c.textAlign='center';
    c.fillText((RI[p.slotP]||p.slotP).slice(0,3),px+16,py+17);
    /* name */
    c.fillStyle=p.l?GOLDL:'#fff';c.font=(p.l?'700 ':'')+'12px "Inter",Arial,sans-serif';c.textAlign='left';
    c.fillText((p.n+(p.l?' ★':'')).slice(0,13),px+34,py+18);
    /* goals */
    if(goals>0){c.fillStyle=G;c.font='700 10px "Inter",Arial,sans-serif';c.textAlign='right';c.fillText('⚽'+goals,px+cw-28,py+18);}
    /* rating */
    c.fillStyle=GOLDL;c.font='700 13px "Montserrat",Arial,sans-serif';c.textAlign='right';
    c.fillText(p.f,px+cw-6,py+18);
  });
  cy+=Math.ceil(players.length/2)*34+16;

  /* footer CTA */
  c.fillStyle='rgba(0,20,60,0.7)';c.fillRect(0,cy,W,H-cy-10);
  c.strokeStyle='rgba(0,61,165,0.5)';c.lineWidth=1;c.beginPath();c.moveTo(0,cy);c.lineTo(W,cy);c.stroke();

  c.fillStyle=MUTED;c.font='13px "Inter",Arial,sans-serif';c.textAlign='center';
  c.fillText('Costruisci la tua Nazionale dei sogni 🇮🇹',W/2,cy+28);

  c.fillStyle=GOLDL;c.font='700 30px "Bebas Neue",Impact,sans-serif';c.textAlign='center';
  c.fillText('www.italiamundial.it',W/2,cy+62);

  c.fillStyle='rgba(255,255,255,0.15)';c.font='11px "Inter",Arial,sans-serif';
  c.fillText('Scarica gratis — nessuna registrazione',W/2,cy+82);

  /* tricolor bottom */
  c.fillStyle=G;c.fillRect(0,H-10,W/3,10);
  c.fillStyle='#fff';c.fillRect(W/3,H-10,W/3,10);
  c.fillStyle=R;c.fillRect(2*W/3,H-10,W/3,10);

  return cv;
}

/* ── SHARE CARD MODAL ─────────────────────────────── */
function ShareCardModal({run,assign,slots,onClose}){
  const[sharing,setSharing]=useState(false);
  const[preview,setPreview]=useState(null);

  useEffect(()=>{
    buildShareCanvas(run,assign,slots).then(cv=>setPreview(cv.toDataURL('image/png')));
  },[]);

  async function handleShare(){
    setSharing(true);
    const cv=await buildShareCanvas(run,assign,slots);
    cv.toBlob(async blob=>{
      const file=new File([blob],'italia-mundial.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{
          await navigator.share({files:[file],title:'Italia Mundial 🇮🇹',text:'Ho costruito la mia Nazionale dei sogni! 🇮🇹 Prova anche tu 👇'});
          setSharing(false);return;
        }catch(e){}
      }
      /* fallback: download */
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;a.download='italia-mundial.png';
      document.body.appendChild(a);a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setSharing(false);
    },'image/png');
  }

  return(
    <div className="modal-bg" onClick={onClose}>
      <div className="modal-box" style={{maxWidth:460}} onClick={e=>e.stopPropagation()}>
        <Tri/>
        <div style={{padding:"14px"}}>
          <div className="label" style={{marginBottom:8}}>ANTEPRIMA IMMAGINE</div>
          {preview&&(
            <div style={{borderRadius:8,overflow:"hidden",marginBottom:12,border:"1px solid var(--border)"}}>
              <img src={preview} alt="Anteprima condivisione" style={{width:"100%",display:"block"}}/>
            </div>
          )}
          {!preview&&<div style={{height:120,display:"flex",alignItems:"center",justifyContent:"center",color:"var(--muted)",fontSize:13}}>Generazione immagine...</div>}
          <button onClick={handleShare} className="btn-red" disabled={sharing||!preview} style={{marginBottom:6,opacity:sharing?0.7:1}}>
            {sharing?"Preparazione...":(navigator.share?"📤 CONDIVIDI IMMAGINE":"⬇ SCARICA IMMAGINE")}
          </button>
          <button onClick={onClose} style={{width:"100%",padding:"10px",borderRadius:8,background:"transparent",color:"var(--muted)",border:"1px solid var(--border)",fontFamily:"'Bebas Neue',sans-serif",fontSize:14,letterSpacing:2}}>CHIUDI</button>
        </div>
      </div>
    </div>
  );
}

/* ── BRACKET VISIVO ──────────────────────────────── */
function Bracket({events,revealed,qualEvents}){
  const matchEvs=events.filter(e=>e.t==="match");

  const standEv=events.find(e=>e.t==="standings");
  const revMatches=matchEvs.slice(0,revealed);
  const stages=["Gironi","Ottavi","Quarti","Semifinale","Finale"];
  const byStage={};for(const m of matchEvs)byStage[m.round]=[...(byStage[m.round]||[]),m];
  const wc=m=>m.winner==="ITA"?GR:m.winner==="DRAW"?"var(--muted)":RED;
  const ic=m=>m.winner==="ITA"?"✓":m.winner==="DRAW"?"=":"✗";
  const isRev=m=>revMatches.includes(m);
  const allGrp=["Gironi","Gironi","Gironi"];
  return(
    <div style={{overflowX:"auto",padding:"14px 14px 6px",WebkitOverflowScrolling:"touch"}}>
      <div style={{display:"flex",gap:0,minWidth:480,alignItems:"flex-start"}}>

        <div style={{width:140,flexShrink:0}}>
          <div className="label" style={{textAlign:"center",marginBottom:6,fontSize:9}}>GIRONI</div>

            return(
              <div key={i} style={{marginBottom:6,borderRadius:7,border:"1px solid "+(rev?wc(m):"var(--border)"),background:rev?"var(--card)":"transparent",padding:"6px 8px",opacity:rev?1:0.35,transition:"all .3s"}}>
                {rev?(
                  <>
                    <div style={{fontSize:10,color:"var(--muted)",marginBottom:2}}>{m.opp.f} {m.opp.n} '{String(m.opp.y).slice(2)}</div>
                    <div style={{fontFamily:"'Montserrat',sans-serif",fontWeight:800,fontSize:16,color:wc(m),lineHeight:1}}>{m.m.gf}–{m.m.ga} <span style={{fontSize:12}}>{ic(m.m)}</span></div>
                  </>
                ):(
                  <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:10,color:"var(--muted)",letterSpacing:1}}>PARTITA {i+1}</div>
                )}
              </div>
            );
          })}
          {standEv&&revealed>=3&&(
            <div style={{marginTop:4,padding:"4px 8px",borderRadius:5,background:standEv.qualified?"rgba(0,146,70,.15)":"rgba(206,43,55,.15)",border:"1px solid "+(standEv.qualified?GR:RED),fontSize:10,textAlign:"center",color:standEv.qualified?GR:RED,fontWeight:700}}>{standEv.qualified?"PASS ✓":"ELIM ✗"}</div>
          )}
        </div>
        {/* Connettore */}
        <div style={{display:"flex",alignItems:"center",padding:"0 4px",paddingTop:30}}>
          <div style={{width:16,height:2,background:"var(--sep)"}}/>
        </div>
        {/* KO stages */}

/* ── APP ──────────────────────────────────────────── */
function App(){
  const[theme,setTheme]=useState(()=>{const t=localStorage.getItem("nm-theme")||"dark";document.documentElement.setAttribute("data-theme",t);return t});
  const[page,setPage]=useState("landing");const[showStoria,setShowStoria]=useState(false);
  const[itaData,setItaData]=useState(ITA); // fallback: dati embedded
  const[form,setForm]=useState("4-3-3");const[sty,setSty]=useState("Equilibrato");const[mode,setMode]=useState("Classico");
  const[slots,setSlots]=useState(FORMS["4-3-3"]);
  const[assign,setAssign]=useState({});const[drawn,setDrawn]=useState(null);const[rerolls,setRerolls]=useState(3);
  const[pending,setPending]=useState(null);const[hlSlots,setHl]=useState([]);
  const[recent,setRecent]=useState([]);const[started,setStarted]=useState(false);const[run,setRun]=useState(null);
  const[qualRun,setQualRun]=useState(null);const[useQual,setUseQual]=useState(false);
  const placed=Object.values(assign).filter(Boolean).map(p=>playerPid(p));
  const iStr=Object.values(assign).filter(Boolean).length===0?80:Object.values(assign).filter(Boolean).reduce((s,p)=>s+p.f,0)/Object.values(assign).filter(Boolean).length;
  // Carica dati da /api/data (proxy Vercel → Supabase, credenziali mai nel browser)
  // Se l'API non risponde o non è configurata, usa i dati embedded silenziosamente
  useEffect(()=>{
    fetch('/api/data')
      .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(squads=>{
        if(!Array.isArray(squads)||!squads.length) return;
        const parsed=squads.map(sq=>({
          y: sq.copa,
          r: ({1970:"Finalista",1978:"4° posto",1982:"🏆 Campione",1990:"3° posto",
               1994:"Finalista",1998:"Quarti",2002:"Ottavi",2006:"🏆 Campione",
               2014:"Fase gironi"})[sq.copa]||String(sq.copa),
          s: (sq.players||[]).map(p=>({
            id:  p.player_id,
            n:   p.name,
            num: p.number||0,
            pos: (()=>{try{return JSON.parse(p.positions)}catch{return[p.positions]}})(),
            f:   p.force||75,
            l:   p.legend?1:0
          }))
        })).filter(ed=>ed.s.length>0);
        if(parsed.length) setItaData(parsed);
      })
      .catch(()=>{}); // fallback silenzioso ai dati embedded
  },[]);
  function themeSet(t){setTheme(t);document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("nm-theme",t)}catch{}}
  function drawNew(){if(!started)setStarted(true);const emptyPos=new Set(slots.filter((_,i)=>!assign[i]).map(s=>s.p));const emptyCompat=new Set([...emptyPos].flatMap(p=>COMPAT[p]||[p]));const avail=itaData.filter(ed=>ed.s.some(p=>!placed.includes(playerPid(p))&&p.pos.some(r=>emptyCompat.has(r))));if(!avail.length)return;const weighted=avail.flatMap(ed=>{const rc=recent.filter(y=>y===ed.y).length;return Array(Math.max(1,4-rc)).fill(ed)});const ed=pick(weighted);setRecent(r=>[...r.slice(-5),ed.y]);setDrawn(ed)}
  function onDraw(){if(!drawn){drawNew();setTimeout(()=>document.getElementById("pitch-el")?.scrollIntoView({behavior:"smooth",block:"start"}),120);}}
  function onReroll(){if(rerolls<=0)return;setRerolls(r=>r-1);setPending(null);setHl([]);drawNew()}
  function onPlayerSelect(p){const v=validSlots(p,slots,assign);if(!v.length)return;if(v.length===1){setAssign(prev=>({...prev,[v[0]]:{...p,edition:drawn?drawn.y:""}}));setDrawn(null);setPending(null);setHl([]);setTimeout(()=>window.scrollTo({top:0,behavior:"smooth"}),80)}else{setPending(p);setHl(v);setTimeout(()=>document.getElementById("pitch-el")?.scrollIntoView({behavior:"smooth",block:"start"}),80)}}
  function onSlotTap(idx){if(!pending||!hlSlots.includes(idx))return;setAssign(prev=>({...prev,[idx]:{...pending,edition:drawn?drawn.y:""}}));setDrawn(null);setPending(null);setHl([]);setTimeout(()=>window.scrollTo({top:0,behavior:"smooth"}),80)}
  function startQual(){const qr=runQualification(Object.values(assign).filter(Boolean),iStr,sty);setQualRun(qr);setPage("qual")}
  function simulate(){setRun(runT(Object.values(assign).filter(Boolean),iStr,sty));setUseQual(false);setPage("sim")}
  function simulateWithQual(){const qr=runQualification(Object.values(assign).filter(Boolean),iStr,sty);setQualRun(qr);if(!qr.qualified){setRun(null);setPage("qual")}else{setUseQual(true);setPage("qual")}}
  function restart(){setAssign({});setDrawn(null);setPending(null);setHl([]);setRun(null);setQualRun(null);setRecent([]);setRerolls(3);setStarted(false);setSlots(FORMS["4-3-3"]);setForm("4-3-3");setSty("Equilibrato");setMode("Classico");setPage("landing")}
  function startGame(){setSlots(FORMS[form]);setAssign({});setDrawn(null);setPending(null);setHl([]);setRecent([]);setRerolls(3);setPage("game")}
  if(page==="landing"&&showStoria)return<ThemeCtx.Provider value={theme}><StoriaPage onClose={()=>setShowStoria(false)}/></ThemeCtx.Provider>;
  if(page==="landing")return<ThemeCtx.Provider value={theme}><Landing onPlay={startGame} onStoria={()=>setShowStoria(true)} theme={theme} setTheme={themeSet}/></ThemeCtx.Provider>;
  if(page==="qual"&&qualRun)return<ThemeCtx.Provider value={theme}><QualView qualRun={qualRun} onContinue={()=>{setRun(runT(Object.values(assign).filter(Boolean),iStr,sty));setPage("sim")}} onRestart={restart}/></ThemeCtx.Provider>;
  if(page==="sim"&&run)return<ThemeCtx.Provider value={theme}><SimView run={run} assign={assign} slots={slots} onRestart={restart} theme={theme} setTheme={themeSet} showQual={useQual} qualRun={qualRun}/></ThemeCtx.Provider>;
  return(
    <ThemeCtx.Provider value={theme}>
      <GamePage slots={slots} assign={assign} drawn={drawn} rerolls={rerolls} pending={pending} hlSlots={hlSlots} mode={mode}
        onDraw={onDraw} onReroll={onReroll} onPlayerSelect={onPlayerSelect} onSlotTap={onSlotTap}
        onCancelPending={()=>{setPending(null);setHl([])}}
        onSimulate={()=>{const filled=Object.values(assign).filter(Boolean).length;if(filled<slots.length)return;simulateWithQual()}}
        onBack={()=>setPage("landing")} onReset={restart} started={started}
        form={form} sty={sty} setForm={f=>{setForm(f);setSlots(FORMS[f]);setAssign({});setDrawn(null);setPending(null);setHl([]);setRecent([]);setRerolls(3)}}
        setSty={setSty} mode={mode} setMode={setMode}
        theme={theme} setTheme={themeSet}/>
    </ThemeCtx.Provider>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
